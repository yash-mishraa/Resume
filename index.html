<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yash Mishra — Resume</title>
  <meta name="description" content="Resume of Yash Mishra. View online with interactive links, download, or print.">
  <meta name="author" content="Yash Mishra">

  <!-- Open Graph / Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Yash Mishra — Resume">
  <meta property="og:description" content="Resume of Yash Mishra. View online, download, or print.">
  <meta property="og:url" content="https://yash-mishraa.github.io/Resume/">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">

  <!-- PDF.js CSS for Text & Annotation layers -->
  <link rel="stylesheet" href="lib/pdf_viewer.css">

  <style>
    :root {
      --bg-color: #0f172a;
      --canvas-bg: #ffffff;
      --header-bg: rgba(15, 23, 42, 0.92);
      --header-border: rgba(255, 255, 255, 0.1);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-bg-hover: rgba(255, 255, 255, 0.16);
      --btn-primary-bg: #2563eb;
      --btn-primary-hover: #1d4ed8;
      --page-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Fixed top toolbar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--header-border);
      padding: 0.65rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-size: 0.72rem;
      font-weight: 500;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
    }

    .badge-live::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 6px #10b981;
    }

    /* Center controls (zoom, page count) */
    .controls-section {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.25rem 0.5rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .control-btn {
      background: var(--btn-bg);
      border: 1px solid transparent;
      color: var(--text-primary);
      width: 32px;
      height: 32px;
      border-radius: 0.375rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.05s;
    }

    .control-btn:hover {
      background: var(--btn-bg-hover);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .control-btn:active {
      transform: scale(0.96);
    }

    .zoom-text {
      min-width: 52px;
      text-align: center;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      user-select: none;
    }

    .fit-btn {
      background: var(--btn-bg);
      border: 1px solid transparent;
      color: var(--text-secondary);
      height: 32px;
      padding: 0 0.6rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.15s;
    }

    .fit-btn:hover {
      background: var(--btn-bg-hover);
      color: var(--text-primary);
    }

    /* Action buttons (download, print, raw) */
    .actions-section {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.85rem;
      font-size: 0.825rem;
      font-weight: 500;
      border-radius: 0.45rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
    }

    .action-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .btn-secondary {
      background: var(--btn-bg);
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-secondary:hover {
      background: var(--btn-bg-hover);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-primary {
      background: var(--btn-primary-bg);
      color: #ffffff;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.2);
    }

    .btn-primary:hover {
      background: var(--btn-primary-hover);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    /* Document container */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 3rem 1rem;
      gap: 1.5rem;
    }

    .page-container {
      position: relative;
      background: var(--canvas-bg);
      border-radius: 4px;
      box-shadow: var(--page-shadow);
      margin: 0 auto;
      overflow: hidden;
      line-height: 1;
    }

    /* High-DPI canvas */
    .page-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Text Layer for selection & search */
    .textLayer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      opacity: 0.25;
      line-height: 1;
      transform-origin: 0 0;
    }

    .textLayer span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    .textLayer ::selection {
      background: #2563eb;
      color: transparent;
    }

    /* Annotation layer for interactive clickable links */
    .annotationLayer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      transform-origin: 0 0;
    }

    .annotationLayer section {
      position: absolute;
      text-align: initial;
      pointer-events: auto;
      box-sizing: border-box;
    }

    .annotationLayer .linkAnnotation > a {
      position: absolute;
      font-size: 1em;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.15s;
    }

    .annotationLayer .linkAnnotation > a:hover {
      background: rgba(37, 99, 235, 0.18);
      outline: 1px dashed rgba(37, 99, 235, 0.4);
    }

    /* Loading indicator */
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 4rem 1rem;
      color: var(--text-secondary);
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error fallback */
    #error-container {
      display: none;
      text-align: center;
      padding: 3rem 1rem;
      max-width: 500px;
    }

    #error-container p {
      color: var(--text-secondary);
      margin: 1rem 0 1.5rem;
    }

    /* Mobile adjustments */
    @media (max-width: 640px) {
      header {
        padding: 0.5rem 0.75rem;
      }
      .brand-title span.hide-on-mobile {
        display: none;
      }
      .actions-section .action-btn span {
        display: none;
      }
      .actions-section .action-btn {
        padding: 0.45rem;
      }
      main {
        padding: 0.75rem 0.5rem 2rem 0.5rem;
        gap: 0.75rem;
      }
    }

    /* Clean, pixel-perfect print layout */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      header,
      #loading-indicator,
      #error-container {
        display: none !important;
      }
      main {
        padding: 0 !important;
        gap: 0 !important;
      }
      .page-container {
        box-shadow: none !important;
        border-radius: 0 !important;
        margin: 0 !important;
        page-break-after: always !important;
        break-after: page !important;
        width: 100% !important;
      }
      .textLayer,
      .annotationLayer {
        display: none !important;
      }
      @page {
        margin: 0;
        size: letter portrait;
      }
    }
  </style>
</head>
<body>

  <!-- Top Sticky Header -->
  <header>
    <div class="brand-section">
      <div class="brand-title">
        <span>Yash Mishra</span>
        <span class="hide-on-mobile" style="color: var(--text-secondary); font-weight: 400;">/ Resume</span>
      </div>
      <span class="badge-live">Online</span>
    </div>

    <div class="controls-section">
      <button class="control-btn" id="btn-zoom-out" title="Zoom Out (-)" aria-label="Zoom Out">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <span class="zoom-text" id="zoom-text">100%</span>
      <button class="control-btn" id="btn-zoom-in" title="Zoom In (+)" aria-label="Zoom In">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <button class="fit-btn" id="btn-fit" title="Fit to Screen Width">
        Fit Width
      </button>
    </div>

    <div class="actions-section">
      <!-- Print Button -->
      <button class="action-btn btn-secondary" id="btn-print" title="Print Resume (Cmd/Ctrl + P)">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        <span>Print</span>
      </button>

      <!-- Raw PDF in New Tab -->
      <a class="action-btn btn-secondary" href="Yash_Mishra_Resume.pdf" target="_blank" rel="noopener" title="Open Original PDF in New Tab">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        <span>Open Raw</span>
      </a>

      <!-- Download Button -->
      <a class="action-btn btn-primary" href="Yash_Mishra_Resume.pdf" download="Yash_Mishra_Resume.pdf" id="btn-download" title="Download PDF Resume">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download PDF</span>
      </a>
    </div>
  </header>

  <!-- Document Viewer Container -->
  <main id="pdf-viewer">
    <div id="loading-indicator">
      <div class="spinner"></div>
      <p>Rendering resume with pixel-perfect fidelity...</p>
    </div>

    <div id="error-container">
      <h3>Unable to render PDF preview</h3>
      <p>You can still download or view the resume directly:</p>
      <a class="action-btn btn-primary" href="Yash_Mishra_Resume.pdf" download>Download Yash_Mishra_Resume.pdf</a>
    </div>
  </main>

  <!-- Load PDF.js -->
  <script src="lib/pdf.min.js"></script>

  <script>
    (function() {
      const PDF_URL = 'Yash_Mishra_Resume.pdf';
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';

      let pdfDoc = null;
      let currentScale = 1.25;
      let baseViewportWidth = 0;
      let isRendering = false;
      const viewerContainer = document.getElementById('pdf-viewer');
      const loadingIndicator = document.getElementById('loading-indicator');
      const errorContainer = document.getElementById('error-container');
      const zoomText = document.getElementById('zoom-text');

      // Calculate initial scale to comfortably fit screen width
      function calculateInitialScale(page) {
        const viewport = page.getViewport({ scale: 1.0 });
        baseViewportWidth = viewport.width;
        const availableWidth = Math.min(window.innerWidth - 32, 920);
        const autoScale = availableWidth / viewport.width;
        // Clamp scale nicely between 0.8 and 1.4 for initial load
        return Math.max(0.75, Math.min(autoScale, 1.35));
      }

      // Render all pages sequentially
      async function renderPages() {
        if (!pdfDoc || isRendering) return;
        isRendering = true;

        try {
          // Clear existing pages except loaders
          const existingPages = viewerContainer.querySelectorAll('.page-container');
          existingPages.forEach(el => el.remove());

          zoomText.textContent = Math.round(currentScale * 100) + '%';

          for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
            const page = await pdfDoc.getPage(pageNum);
            const viewport = page.getViewport({ scale: currentScale });

            // Create wrapper
            const pageWrapper = document.createElement('div');
            pageWrapper.className = 'page-container';
            pageWrapper.id = `page-${pageNum}`;
            pageWrapper.style.width = `${Math.floor(viewport.width)}px`;
            pageWrapper.style.height = `${Math.floor(viewport.height)}px`;

            // Canvas with High-DPI support
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { alpha: false });
            const outputScale = window.devicePixelRatio || 1;

            canvas.width = Math.floor(viewport.width * outputScale);
            canvas.height = Math.floor(viewport.height * outputScale);
            canvas.style.width = `${Math.floor(viewport.width)}px`;
            canvas.style.height = `${Math.floor(viewport.height)}px`;

            const transform = outputScale !== 1 
              ? [outputScale, 0, 0, outputScale, 0, 0] 
              : null;

            pageWrapper.appendChild(canvas);

            // Text Layer
            const textLayerDiv = document.createElement('div');
            textLayerDiv.className = 'textLayer';
            pageWrapper.appendChild(textLayerDiv);

            // Annotation Layer (for hyperlinks)
            const annotationLayerDiv = document.createElement('div');
            annotationLayerDiv.className = 'annotationLayer';
            pageWrapper.appendChild(annotationLayerDiv);

            viewerContainer.appendChild(pageWrapper);

            // Render PDF page to canvas
            const renderContext = {
              canvasContext: ctx,
              viewport: viewport,
              transform: transform
            };
            await page.render(renderContext).promise;

            // Render text layer
            const textContent = await page.getTextContent();
            pdfjsLib.renderTextLayer({
              textContentSource: textContent,
              container: textLayerDiv,
              viewport: viewport,
              textDivs: []
            });

            // Render interactive hyperlinks
            const annotations = await page.getAnnotations();
            if (annotations && annotations.length > 0) {
              pdfjsLib.AnnotationLayer.render({
                viewport: viewport.clone({ dontFlip: true }),
                div: annotationLayerDiv,
                annotations: annotations,
                page: page,
                linkService: {
                  getDestinationHash: () => '#',
                  getAnchorUrl: (hash) => hash,
                  setHash: () => {},
                  executeNamedAction: () => {},
                  addLinkAttributes: (link, url, newWindow) => {
                    link.href = url;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                  }
                }
              });
            }
          }

          loadingIndicator.style.display = 'none';
        } catch (err) {
          console.error('Render error:', err);
        } finally {
          isRendering = false;
        }
      }

      // Load PDF
      pdfjsLib.getDocument({
        url: PDF_URL,
        cMapUrl: 'lib/cmaps/',
        cMapPacked: true,
      }).promise.then(async (doc) => {
        pdfDoc = doc;
        const firstPage = await pdfDoc.getPage(1);
        currentScale = calculateInitialScale(firstPage);
        await renderPages();
      }).catch((err) => {
        console.error('Failed to load PDF document:', err);
        loadingIndicator.style.display = 'none';
        errorContainer.style.display = 'block';
      });

      // Controls
      document.getElementById('btn-zoom-in').addEventListener('click', () => {
        if (currentScale < 2.5) {
          currentScale = Math.min(2.5, +(currentScale + 0.15).toFixed(2));
          renderPages();
        }
      });

      document.getElementById('btn-zoom-out').addEventListener('click', () => {
        if (currentScale > 0.5) {
          currentScale = Math.max(0.5, +(currentScale - 0.15).toFixed(2));
          renderPages();
        }
      });

      document.getElementById('btn-fit').addEventListener('click', () => {
        if (baseViewportWidth > 0) {
          const availableWidth = Math.min(window.innerWidth - 32, 960);
          currentScale = +(availableWidth / baseViewportWidth).toFixed(2);
          renderPages();
        }
      });

      // Print Button handler
      document.getElementById('btn-print').addEventListener('click', () => {
        window.print();
      });

      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) {
          e.preventDefault();
          document.getElementById('btn-zoom-in').click();
        } else if ((e.ctrlKey || e.metaKey) && e.key === '-') {
          e.preventDefault();
          document.getElementById('btn-zoom-out').click();
        } else if ((e.ctrlKey || e.metaKey) && e.key === '0') {
          e.preventDefault();
          document.getElementById('btn-fit').click();
        }
      });

      // Re-scale gracefully on window resize
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          if (pdfDoc && baseViewportWidth > 0) {
            const availableWidth = Math.min(window.innerWidth - 32, 920);
            const targetScale = +(availableWidth / baseViewportWidth).toFixed(2);
            // Only re-render if meaningful resize
            if (Math.abs(targetScale - currentScale) > 0.1) {
              currentScale = targetScale;
              renderPages();
            }
          }
        }, 300);
      });
    })();
  </script>
</body>
</html>
